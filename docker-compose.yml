services:
  db:
    image: postgres:16-alpine
    container_name: constructor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: constructor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-constructor}
      POSTGRES_DB: constructor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constructor -d constructor"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    image: constructor-presentaciones-api
    container_name: constructor-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://constructor:${DB_PASSWORD:-constructor}@db:5432/constructor
    depends_on:
      db:
        condition: service_healthy

  constructor:
    build: .
    image: constructor-presentaciones
    container_name: constructor-presentaciones
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:80"
    depends_on:
      - api

volumes:
  pgdata:
