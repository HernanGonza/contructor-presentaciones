        # ── Constructor de presentaciones ── (pegar dentro del server { } de ecodatos/infra/nginx/nginx.conf)
        # Con variable + resolver, si el contenedor del constructor está caído el nginx de ecodatos arranca igual
        # (con proxy_pass directo a un nombre, nginx no inicia si no lo puede resolver).
        location = /presentaciones { return 301 /presentaciones/; }

        location ^~ /presentaciones/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $constructor http://constructor-presentaciones:80;
            rewrite ^/presentaciones/(.*)$ /$1 break;
            proxy_pass $constructor;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
